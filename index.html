<!-- @startingPoint section="Personal Website" subtitle="File-cabinet personal site (tabs → grid/list/detail)" viewport="1180x900" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarthak's Site</title>
<link rel="stylesheet" href="./styles.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* Opening the drawer makes the page outgrow the viewport, and the scrollbar
   that appears would otherwise shrink the layout mid-animation. */
html{scrollbar-gutter:stable}
/* Stops iOS inflating body copy when the phone is rotated. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bone-dk);color:var(--ink-900);font-family:var(--font-body)}
/* The default blue tap flash reads as a bug against this palette. */
a,button,.tab,.tile{-webkit-tap-highlight-color:rgba(232,83,29,.18)}
.wrap{max-width:1180px;margin:0 auto;padding:0 26px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--link)}a:hover{color:var(--link-hover)}
::selection{background:var(--orange-500);color:#fff}
/* status */
.status{border-bottom:1.5px solid var(--ink-900);background:var(--bone)}
.status .wrap{display:flex;align-items:center;justify-content:space-between;height:46px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em}
.status .l{display:flex;gap:22px;align-items:center}.status .dot{color:var(--orange-500)}.status .mut{opacity:.5}.status .r{opacity:.65}
/* cabinet */
.cab{padding:44px 26px 60px;max-width:1180px;margin:0 auto}
.cab-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;gap:20px}
.cab-head .k{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;opacity:.6}
.cab-head h1{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,3.4vw,38px);letter-spacing:-.03em;line-height:.98;margin-top:10px;text-transform:uppercase}
.cab-head .rt{font-family:var(--font-mono);font-size:11px;text-align:right;opacity:.6;line-height:1.7}
/* drawer box */
.drawer{position:relative;margin-top:6px}
.drawerbox{position:relative;padding:16px 18px 18px}
.railback{position:absolute;top:0;left:0;right:0;height:16px;background:var(--ink-900)}
.rail{position:absolute;top:0;bottom:0;width:18px;background:var(--ink-900)}
.rail.l{left:0}.rail.r{right:0}
/* Drawer open/close. Animating grid-template-rows lets the box expand to the
   tabs' real height; the inner element does the clipping. */
.folders-clip{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease-standard)}
.drawer.open .folders-clip{grid-template-rows:1fr}
.folders-inner{overflow:hidden;min-height:0}
/* Padding, not margin: the hover lift needs somewhere to go that the clip
   won't cut off, and padding sits inside the overflow box. */
.folders{position:relative;display:flex;flex-direction:column;padding-top:14px;opacity:0;transition:opacity .28s ease .08s}
.drawer.open .folders{opacity:1}
.tab{position:relative;border:1.5px solid var(--ink-900);background:var(--paper);height:66px;display:flex;align-items:center;padding:0 28px;margin-bottom:-1.5px;z-index:1;transition:transform .18s var(--ease-standard),background .18s,color .18s,box-shadow .18s}
.tab .num{font-family:var(--font-mono);font-size:13px;letter-spacing:.1em;color:var(--orange-500);width:60px;font-weight:700}
.tab .name{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-.02em;text-transform:uppercase}
.tab .desc{font-family:var(--font-mono);font-size:12px;opacity:.55;margin-left:auto;padding-left:20px}
.tab.r .desc{order:1;margin-left:0;margin-right:auto;padding-left:0;padding-right:20px}
.tab.r .num{order:2}.tab.r .name{order:3}.tab.r .arw{order:4}
.tab .arw{margin-left:22px;width:20px;height:20px;opacity:.4;transition:opacity .18s,transform .18s}
.tab:hover{background:var(--ink-900);color:var(--paper);transform:translateY(-9px);z-index:10;box-shadow:var(--shadow-card)}
.tab:hover .name{color:var(--paper)}.tab:hover .desc{opacity:.7}.tab:hover .num{color:var(--orange-200)}
.tab:hover .arw{opacity:1;transform:translateX(4px)}
/* drawer front (the pull face) */
/* Right padding reserves the dither strip. The bio is right-aligned, so its
   edge has to stop before the orange rather than run under it. */
.drawerfront{position:relative;margin:0 -14px;border:1.5px solid var(--ink-900);background:var(--ink-900);color:var(--paper);padding:42px 268px 34px 44px;overflow:hidden;box-shadow:var(--shadow-lg)}
.drawerfront{transition:transform .5s var(--ease-standard),box-shadow .5s var(--ease-standard)}
.drawer.open .drawerfront{transform:translateY(7px)}
/* The pull. Grip keeps the old handle's look; the label makes it read as a control. */
.drawerfront .handle{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:13px;padding:5px 9px;z-index:3}
.drawerfront .handle .grip{width:120px;height:12px;border:1.5px solid var(--orange-200);border-radius:7px;transition:background .18s,border-color .18s}
.drawerfront .handle .hint{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--orange-200);opacity:.7;white-space:nowrap;transition:opacity .18s,color .18s}
.drawerfront .handle:hover .grip{background:var(--orange-500);border-color:var(--orange-500)}
.drawerfront .handle:hover .hint{opacity:1;color:var(--orange-500)}
.drawerfront .handle:focus-visible{outline:2px solid var(--orange-500);outline-offset:4px}
.drawerfront .dith{position:absolute;top:0;right:0;width:230px;height:100%;background:var(--orange-500);opacity:.92}
.drawerfront .dith .d{position:absolute;inset:0;background-image:radial-gradient(var(--ink-900) 32%,transparent 33%);background-size:12px 12px;-webkit-mask:linear-gradient(255deg,#000,transparent 78%);mask:linear-gradient(255deg,#000,transparent 78%)}
/* Same mono/orange treatment the eyebrow had, minus the uppercasing and wide
   tracking — a 117-character quote needs to stay readable. */
.drawerfront .front-quote{font-family:var(--font-mono);font-size:12px;letter-spacing:.05em;line-height:1.7;color:var(--orange-500);max-width:600px;margin-top:10px;text-align:left}
.drawerfront .front-cite{display:block;margin-top:7px;font-size:11px;letter-spacing:.08em;opacity:.7}
/* Clamped so the single line survives narrow viewports instead of overflowing. */
.drawerfront h2{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,6.15vw,74px);line-height:1;letter-spacing:-.045em;text-transform:uppercase;margin-top:16px;white-space:nowrap;text-align:center}
.drawerfront h2 .p{color:var(--orange-500)}
.drawerfront .bio{font-family:var(--font-body);font-size:15px;line-height:1.7;max-width:620px;color:#c9c9be;margin:22px 0 0 auto;text-align:right}
/* subpage */
.subhead{border-bottom:1.5px solid var(--ink-900);background:var(--bone)}
.subhead .wrap{padding:30px 26px 26px}
.back{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;display:inline-flex;align-items:center;gap:8px;opacity:.7;margin-bottom:22px}
.back:hover{opacity:1;color:var(--orange-600)}
.subhead .k{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;color:var(--orange-600)}
.subhead h1{font-family:var(--font-display);font-weight:700;font-size:60px;letter-spacing:-.04em;line-height:.94;text-transform:uppercase;margin-top:12px}
.subhead p{font-family:var(--font-body);font-size:16px;line-height:1.55;max-width:560px;margin-top:16px;color:var(--ink-700)}
/* grid */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px}
/* Grid items are min-width:auto by default, so a card whose stat row can't
   shrink below its min-content pushes past its track and scrolls the page —
   which it did at 320px. No effect where the track is already wide enough. */
.grid3>*{min-width:0}
.grid3>* *{min-width:0}
/* list */
.list{border-top:1.5px solid var(--ink-900);margin-top:30px}
.li{display:grid;grid-template-columns:130px 1fr auto;gap:24px;align-items:center;padding:22px 4px;border-bottom:1.5px solid var(--ink-900);transition:background .15s}
.li:hover{background:var(--paper)}
.li .yr{font-family:var(--font-mono);font-size:12px;color:var(--orange-600)}
.li h4{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:-.01em}
.li .org{font-family:var(--font-mono);font-size:12px;opacity:.6;margin-top:4px}
.li .ext{font-family:var(--font-mono);font-size:12px;opacity:.5}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px}
.tile{border:1.5px solid var(--ink-900);background:var(--paper);padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-card);transition:transform .18s,box-shadow .18s;text-decoration:none;color:var(--ink-900)}
.tile:hover{transform:translate(-3px,-3px);box-shadow:var(--shadow-accent)}
.tile .tn{font-family:var(--font-display);font-weight:600;font-size:19px}
.tile .th{font-family:var(--font-mono);font-size:12px;opacity:.6}
.tile .arw{margin-top:auto;font-family:var(--font-mono);font-size:12px;color:var(--orange-600)}
/* detail */
.detail{padding-top:30px}
.detail .tagabs{position:absolute;top:14px;left:14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;background:var(--ink-900);color:var(--paper);padding:5px 11px}
/* Sizes to the real number of stats (set inline), rather than a fixed four. */
.dstats{display:grid;grid-template-columns:repeat(var(--dstat-n,4),1fr);border:1.5px solid var(--ink-900);border-top:none}
.dstats .c{padding:18px 20px;border-right:1.5px solid var(--ink-900)}.dstats .c:last-child{border-right:none}
.dstats .v{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:-.02em}.dstats .v.o{color:var(--orange-500)}
.dstats .lb{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.55;margin-top:3px}
.dcols{display:grid;grid-template-columns:1.7fr .9fr;gap:34px;margin-top:36px}
/* No Details sidebar to show — give the prose the full measure. */
.dcols.solo{grid-template-columns:1fr}
.dcols.solo article{max-width:760px}
/* Linked papers / repos under the prose. Same hard-bordered treatment as the
   list rows, so it reads as part of the system rather than web links. */
.dlinks{margin-top:34px;border-top:1.5px solid var(--ink-900)}
.dlinks .dlh{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-600);padding:14px 0 10px}
.dlinks .dl{display:block;padding:14px 0;border-top:1px solid var(--hair);text-decoration:none;color:var(--ink-900);transition:background .15s,padding-left .15s}
.dlinks .dl:hover{background:var(--paper);padding-left:10px}
.dlinks .dlt{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:-.01em;color:var(--ink-900)}
.dlinks .dl:hover .dlt{color:var(--orange-600)}
.dlinks .dlt svg{width:15px;height:15px;opacity:.5}
.dlinks .dl:hover .dlt svg{opacity:1}
.dlinks .dld{display:block;font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--ink-700);margin-top:5px;max-width:640px}
/* Linked list rows (repos). Experience rows have no URL and stay plain. */
.li-link{text-decoration:none;color:inherit}
.li-link:hover h4{color:var(--orange-600)}
.li h4 .ext-arw{width:14px;height:14px;margin-left:7px;opacity:.4;vertical-align:middle}
.li-link:hover h4 .ext-arw{opacity:1}
.dcols article p{font-family:var(--font-body);font-size:17px;line-height:1.75;color:var(--ink-700);margin-bottom:18px}
.dcols article .lead{font-size:20px;color:var(--ink-900);line-height:1.6}
.dcols article .pull{border-left:3px solid var(--orange-500);padding:6px 0 6px 22px;margin:28px 0;font-family:var(--font-display);font-weight:500;font-size:23px;line-height:1.35;letter-spacing:-.01em;color:var(--ink-900)}
.dcols aside{align-self:start;border:1.5px solid var(--ink-900);background:var(--paper)}
.dcols aside .ah{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:14px 18px;border-bottom:1.5px solid var(--ink-900);background:var(--ink-900);color:var(--paper)}
.dcols aside .ar{display:flex;justify-content:space-between;gap:12px;font-family:var(--font-mono);font-size:12px;padding:12px 18px;border-bottom:1px solid var(--hair)}
.dcols aside .ar:last-child{border-bottom:none}
.dcols aside .ar span:first-child{color:var(--orange-600)}.dcols aside .ar span:last-child{color:var(--ink-900);opacity:.65;text-align:right}
.foot{border-top:1.5px solid var(--ink-900);margin-top:56px;padding:26px 0;font-family:var(--font-mono);font-size:11px;display:flex;justify-content:space-between;opacity:.6}
/* ============================================================
   RESPONSIVE — tablet <=900px, phone <=600px.
   Layout only: hard borders, square corners, offset shadows and mono chrome
   all stay. Nothing here changes the desktop design.
   ============================================================ */
@media (max-width:900px){
  .cab{padding:32px 20px 48px}
  .cab-head{flex-wrap:wrap;gap:14px}
  /* The dither is a fixed 230px strip; below this width it would sit on top of
     the front's text, so it narrows and the right padding reserves what's left. */
  .drawerfront{padding:38px 92px 28px 26px}
  .drawerfront .dith{width:72px}
  .drawerfront .front-quote,.drawerfront .bio{max-width:none}
  .subhead h1{font-size:clamp(32px,9vw,60px)}
  .grid3,.tiles{grid-template-columns:repeat(2,1fr)}
  .dcols{grid-template-columns:1fr;gap:26px}
  /* Two-up stats need the interior borders redrawn for the new grid. Which
     cells sit in the final row depends on the count, so the rules are written
     per count off data-n — a generic nth-child rule drew half a row rule under
     three stats. An odd final cell spans the full width so there is no gap. */
  .dstats{grid-template-columns:repeat(2,1fr)}
  .dstats .c{border-bottom:1.5px solid var(--ink-900)}
  .dstats .c:nth-child(2n){border-right:none}
  .dstats[data-n="2"] .c{border-bottom:none}
  .dstats[data-n="3"] .c:nth-child(n+3){border-bottom:none}
  .dstats[data-n="3"] .c:last-child{grid-column:1/-1;border-right:none}
  .dstats[data-n="4"] .c:nth-child(n+3){border-bottom:none}
}
@media (max-width:600px){
  .wrap,.subhead .wrap{padding-left:16px;padding-right:16px}
  .cab{padding:26px 16px 40px}
  .cab-head .rt{text-align:left}
  .status .wrap{height:42px;font-size:10px}
  .status .l{gap:12px}
  .grid3,.tiles{grid-template-columns:1fr}
  .drawerfront{padding:34px 64px 24px 18px}
  .drawerfront .dith{width:48px}
  /* Floor is low because the greeting is a single nowrap line — see note in
     the commit body; the brief's 40px floor predates that change. */
  .drawerfront h2{font-size:clamp(20px,6.6vw,44px)}
  /* Folder tabs stack: the l/r alternation is a desktop conceit and there is no
     room for num + name + desc on one row. Order resets so every tab reads the
     same way; min-height keeps the tap target over 44px. */
  .tab{flex-direction:column;align-items:flex-start;justify-content:center;height:auto;min-height:76px;padding:14px 52px 14px 16px;gap:3px}
  .tab .num{width:auto}
  .tab .desc{margin:0;padding:0}
  .tab.r .num,.tab.r .name,.tab.r .desc,.tab.r .arw{order:0}
  .tab .arw{position:absolute;right:16px;top:50%;transform:translateY(-50%);margin:0}
  .tab:hover .arw{transform:translateY(-50%) translateX(4px)}
  /* Stack yr / title / ext instead of squeezing three columns. */
  .li{grid-template-columns:1fr;gap:6px;padding:18px 2px}
  /* Only on phone: long headlines must be allowed to break rather than widen
     the card. Left off desktop so typography there is untouched. */
  .grid3>* h3,.grid3>* p{overflow-wrap:anywhere}
  .tile{min-height:44px}
  .foot{flex-direction:column;gap:8px}
  /* The pull becomes a full-width rail. At 25px tall it was the main control
     on the landing page and well under a thumb-sized target; spanning the
     drawer front reads as a drawer pull rather than a floating pill. */
  .drawerfront{padding-top:60px}
  .drawerfront .handle{top:0;left:0;right:0;transform:none;width:100%;justify-content:center;padding:15px 0;border-bottom:1.5px solid rgba(232,83,29,.28)}
  .drawerfront .handle .grip{width:74px}
}
/* Touch devices: nothing here is reachable by hover, so link affordances that
   normally appear on hover are shown by default, and controls get thumb-sized
   targets. Keyed to the pointer, not the width — tablets are touch too. */
@media (pointer:coarse){
  .tab .arw{opacity:.8}
  .li h4 .ext-arw{opacity:.9}
  .dlinks .dlt svg{opacity:.9}
  .back{padding:14px 0;margin-bottom:10px}
  .dlinks .dl{padding:17px 0}
}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.451.0/dist/umd/lucide.min.js"></script>
<script src="./_ds_bundle.js"></script>
<script src="./data.js"></script>
</head>
<body><div id="root"></div>
<script src="./Cabinet.js"></script>
<script src="./Pages.js"></script>
<script src="./App.js"></script>
